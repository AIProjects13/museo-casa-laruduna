# Publica el museo en GitHub Pages cada vez que cambia la rama principal.
name: Publicar el museo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Para abrir el sitio a los buscadores, crea la variable SITIO_PUBLICO=1
      # en Settings > Secrets and variables > Actions > Variables.
      - run: npm run exportar
        env:
          SITIO_PUBLICO: ${{ vars.SITIO_PUBLICO }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
